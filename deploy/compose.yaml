name: momentum
services:
  app:
    image: momentum-app:local
    build:
      context: ..
      dockerfile: Dockerfile
    env_file:
      - ${MOMENTUM_ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8787
      PRISM_STATIC_DIR: /app/dist
      PRISM_ALLOWED_ORIGINS: ${PRISM_ALLOWED_ORIGINS:?Set the exact HTTPS app origin}
    expose:
      - "8787"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 256m
    restart: unless-stopped
    stop_grace_period: 15s
  proxy:
    image: caddy:2-alpine
    depends_on:
      app:
        condition: service_healthy
    environment:
      MOMENTUM_DOMAIN: ${MOMENTUM_DOMAIN:?Set your public DNS hostname}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 128m
    restart: unless-stopped
volumes:
  caddy_data:
  caddy_config:
